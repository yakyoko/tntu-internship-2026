services:
  cosmos-db:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:a8b93e25520e999d867ed3949e7de7f4ff3ddab23ca95fa6f90230de5dd9729b
    tty: true
    mem_limit: 4G
    ports:
      - '8081:8081'
      - '10250:10250'
      - '10251:10251'
      - '10252:10252'
      - '10253:10253'
      - '10254:10254'
      - '10255:10255'
    restart: unless-stopped
    volumes:
      - vol_cosmos:/tmp/cosmos/appdata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  projects-api:
    build:
      context: .
      dockerfile: src/Projects.Api/Dockerfile
    ports:
      - '5001:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CosmosDb__Endpoint=${COSMOS_ENDPOINT}
      - CosmosDb__Key=${COSMOS_KEY}
      - CosmosDb__DatabaseName=TaskBoard
      - CosmosDb__ProjectsContainer=projects
    depends_on:
      cosmos-db:
        condition: service_healthy

  tasks-api:
    build:
      context: .
      dockerfile: src/Tasks.Api/Dockerfile
    ports:
      - '5002:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CosmosDb__Endpoint=${COSMOS_ENDPOINT}
      - CosmosDb__Key=${COSMOS_KEY}
      - CosmosDb__DatabaseName=TaskBoard
      - CosmosDb__TasksContainer=tasks
      - ProjectsApi__BaseUrl=http://projects-api:8080
    depends_on:
      projects-api:
        condition: service_started
      cosmos-db:
        condition: service_healthy

volumes:
  vol_cosmos:
